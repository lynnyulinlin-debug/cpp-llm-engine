name: CPU and docs CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Default CPU regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Check documentation style
        run: npm run docs:check-style

      - name: Build documentation and check links
        run: npm run docs:check-links

      - name: Run dependency-free CPU regression
        run: npm run test:regression

      - name: Check that validation leaves tracked files unchanged
        run: git diff --exit-code
