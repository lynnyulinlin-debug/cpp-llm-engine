<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">cpp-llm-engine 教程主图</title>
  <desc id="desc">展示教程从真实模型基线出发，沿 C++ CPU 主线构建推理服务，并扩展到单消费级 GPU、多模态输入和成熟框架对照。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #475569; }
      .section { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .label { font-family: "Noto Sans CJK SC", sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #64748b; }
      .badge { font-family: "Noto Sans CJK SC", sans-serif; font-size: 12px; font-weight: 700; }
      .card { stroke: #334155; stroke-width: 1.6; rx: 15; filter: url(#shadow); }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="26" fill="url(#background)"/>
  <circle cx="1175" cy="58" r="115" fill="#bfdbfe" opacity="0.28"/>
  <circle cx="88" cy="715" r="135" fill="#bbf7d0" opacity="0.28"/>

  <text x="48" y="48" class="title">从真实模型到可验证的 C++ 推理服务</text>
  <text x="48" y="76" class="subtitle">CPU 完整主线 · 单消费级 NVIDIA GPU 可选 · 多模态复用同一 Runtime</text>

  <rect x="925" y="34" width="92" height="28" rx="14" fill="#dcfce7"/>
  <text x="971" y="53" text-anchor="middle" class="badge" fill="#166534">CPU 完整</text>
  <rect x="1028" y="34" width="98" height="28" rx="14" fill="#dbeafe"/>
  <text x="1077" y="53" text-anchor="middle" class="badge" fill="#1d4ed8">GPU 可选</text>
  <rect x="1137" y="34" width="96" height="28" rx="14" fill="#fef3c7"/>
  <text x="1185" y="53" text-anchor="middle" class="badge" fill="#92400e">中文优先</text>

  <text x="48" y="116" class="section">学习主线 · 每一阶段都有可运行产物</text>

  <rect x="48" y="138" width="204" height="104" class="card" fill="#fef3c7"/>
  <text x="150" y="171" text-anchor="middle" class="label">起点与基线</text>
  <text x="150" y="198" text-anchor="middle" class="small">Foundation · Chapter00</text>
  <text x="150" y="220" text-anchor="middle" class="tiny">工具链 + llama.cpp / TinyLlama</text>

  <rect x="293" y="138" width="204" height="104" class="card" fill="#e0f2fe"/>
  <text x="395" y="171" text-anchor="middle" class="label">输入与对象</text>
  <text x="395" y="198" text-anchor="middle" class="small">Chapter01 - 02</text>
  <text x="395" y="220" text-anchor="middle" class="tiny">Tokenizer · GGUF · Tensor View</text>

  <rect x="538" y="138" width="204" height="104" class="card" fill="#dbeafe"/>
  <text x="640" y="171" text-anchor="middle" class="label">计算与结构</text>
  <text x="640" y="198" text-anchor="middle" class="small">Chapter03 - 04</text>
  <text x="640" y="220" text-anchor="middle" class="tiny">Backend · Attention · Decoder</text>

  <rect x="783" y="138" width="204" height="104" class="card" fill="#dcfce7"/>
  <text x="885" y="171" text-anchor="middle" class="label">运行时与表示</text>
  <text x="885" y="198" text-anchor="middle" class="small">Chapter05 - 06</text>
  <text x="885" y="220" text-anchor="middle" class="tiny">Request · KV · Quantization</text>

  <rect x="1028" y="138" width="204" height="104" class="card" fill="#fce7f3"/>
  <text x="1130" y="171" text-anchor="middle" class="label">证据与服务</text>
  <text x="1130" y="198" text-anchor="middle" class="small">Chapter07 - 09</text>
  <text x="1130" y="220" text-anchor="middle" class="tiny">Benchmark · Profile · HTTP</text>

  <path d="M252 190 H288" class="line"/>
  <path d="M497 190 H533" class="line"/>
  <path d="M742 190 H778" class="line"/>
  <path d="M987 190 H1023" class="line"/>

  <text x="48" y="296" class="section">软件骨架 · 契约稳定，执行路径可替换</text>

  <rect x="100" y="318" width="260" height="92" class="card" fill="#fef3c7"/>
  <text x="230" y="351" text-anchor="middle" class="label">code/core</text>
  <text x="230" y="378" text-anchor="middle" class="small">Tensor / Backend / Decoder Contract</text>
  <text x="230" y="398" text-anchor="middle" class="tiny">CPU 与 CUDA 共用语义</text>

  <rect x="500" y="318" width="280" height="92" class="card" fill="#dbeafe"/>
  <text x="640" y="351" text-anchor="middle" class="label">code/engine</text>
  <text x="640" y="378" text-anchor="middle" class="small">Model → Context → Runtime</text>
  <text x="640" y="398" text-anchor="middle" class="tiny">真实权重、请求隔离和执行适配</text>

  <rect x="920" y="318" width="260" height="92" class="card" fill="#dcfce7"/>
  <text x="1050" y="351" text-anchor="middle" class="label">ServiceCore</text>
  <text x="1050" y="378" text-anchor="middle" class="small">Scheduler / Metrics / HTTP / SSE</text>
  <text x="1050" y="398" text-anchor="middle" class="tiny">CPU 服务闭环，可替换 transport</text>

  <path d="M360 364 H495" class="line"/>
  <path d="M780 364 H915" class="line"/>

  <text x="48" y="464" class="section">能力扩展 · 不复制主线，只替换输入或执行后端</text>

  <rect x="48" y="486" width="365" height="120" class="card" fill="#dbeafe"/>
  <text x="70" y="518" class="label">CUDA 执行扩展</text>
  <text x="70" y="545" class="small">Device / Stream · cuBLAS · Q4_K/Q6_K Linear</text>
  <text x="70" y="568" class="small">RoPE · 连续 KV · GQA · 合成 Decoder</text>
  <text x="70" y="591" class="tiny">下一里程碑：真实 TinyLlama GPU Decoder</text>
  <path d="M230 410 V481" class="dash"/>

  <rect x="458" y="486" width="365" height="120" class="card" fill="#fef3c7"/>
  <text x="480" y="518" class="label">SmolVLM 多模态 CPU 扩展</text>
  <text x="480" y="545" class="small">动态切图 · Vision Encoder · Projector</text>
  <text x="480" y="568" class="small">图文 Embedding · Decoder · ServiceCore</text>
  <text x="480" y="591" class="tiny">真实图片、同步/SSE 与 profiling golden 已闭环</text>
  <path d="M640 410 V481" class="dash"/>

  <rect x="868" y="486" width="364" height="120" class="card" fill="#f1f5f9"/>
  <text x="890" y="518" class="label">成熟框架工程对照</text>
  <text x="890" y="545" class="small">llama.cpp：真实 baseline 与 GGUF</text>
  <text x="890" y="568" class="small">Tiny/nano：算法骨架 · vLLM/SGLang：服务系统</text>
  <text x="890" y="591" class="tiny">TensorRT-LLM / DeepInfer：GPU 与生产工程坐标</text>
  <path d="M1050 410 V481" class="dash"/>

  <text x="48" y="658" class="section">教学证据链</text>
  <rect x="48" y="676" width="1184" height="48" rx="24" fill="#0f172a"/>
  <text x="166" y="706" text-anchor="middle" class="badge" fill="#f8fafc">算法与数据契约</text>
  <text x="410" y="706" text-anchor="middle" class="badge" fill="#bfdbfe">C++ 可运行实现</text>
  <text x="650" y="706" text-anchor="middle" class="badge" fill="#bbf7d0">CTest / Golden</text>
  <text x="884" y="706" text-anchor="middle" class="badge" fill="#fde68a">Benchmark / Profiling</text>
  <text x="1100" y="706" text-anchor="middle" class="badge" fill="#fbcfe8">框架源码坐标</text>
  <path d="M268 700 H310 M510 700 H552 M750 700 H792 M984 700 H1026" stroke="#94a3b8" stroke-width="2"/>
</svg>
