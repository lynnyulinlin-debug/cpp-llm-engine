<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">文本占位符展开为 Visual Embedding</title>
  <desc id="desc">文本 embedding 序列中的图片占位行被同宽度的一个或多个视觉向量替换，输出保留每行来源。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset="1" stop-color="#deece7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#284b45"/>
    </marker>
    <style>
      .title { font: 700 28px 'Noto Sans CJK SC', sans-serif; fill: #173832; }
      .subtitle { font: 500 15px 'Noto Sans CJK SC', sans-serif; fill: #5d716c; }
      .heading { font: 700 18px 'Noto Sans CJK SC', sans-serif; fill: #173832; }
      .body { font: 500 14px 'Noto Sans CJK SC', sans-serif; fill: #284b45; }
      .small { font: 500 12px 'Noto Sans CJK SC', sans-serif; fill: #60756f; }
      .box { stroke: #284b45; stroke-width: 2; rx: 15; }
      .flow { stroke: #284b45; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <text x="55" y="55" class="title">图文序列：替换占位行，不改变 Embedding Width</text>
  <text x="55" y="85" class="subtitle">Prompt 解析决定片段顺序；组装器只验证位置、width、展开结果和来源</text>

  <rect x="55" y="145" width="265" height="300" class="box" fill="#fffaf0"/>
  <text x="82" y="183" class="heading">文本 Embedding · width 960</text>
  <rect x="83" y="215" width="208" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="105" y="245" class="body">BOS · text row 0</text>
  <rect x="83" y="280" width="208" height="48" rx="9" fill="#f6d9c9" stroke="#a5522c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="105" y="310" class="body">图片占位行 · 丢弃</text>
  <rect x="83" y="345" width="208" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="105" y="375" class="body">EOS · text row 2</text>

  <rect x="405" y="185" width="250" height="220" class="box" fill="#e7eff9"/>
  <text x="435" y="225" class="heading">Visual Embedding</text>
  <text x="435" y="260" class="body">Projector 输出 · width 960</text>
  <rect x="435" y="290" width="190" height="48" rx="9" fill="#dcece7" stroke="#78928b"/>
  <text x="458" y="320" class="body">visual row 0..N-1</text>
  <text x="435" y="360" class="small">最小验证 N=1 · 完整 tile N=64</text>

  <rect x="745" y="145" width="400" height="300" class="box" fill="#fffdf7"/>
  <text x="775" y="183" class="heading">统一 Decoder 输入 · [2+N, 960]</text>
  <rect x="775" y="215" width="340" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="797" y="245" class="body">text:0</text>
  <rect x="775" y="280" width="340" height="48" rx="9" fill="#dcece7" stroke="#4f8277" stroke-width="2"/>
  <text x="797" y="310" class="body">visual:0:0 ... visual:0:N-1</text>
  <rect x="775" y="345" width="340" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="797" y="375" class="body">text:2</text>

  <path d="M320 240 H365 V275 H405" class="flow"/>
  <path d="M655 295 H745" class="flow"/>
  <path d="M320 370 H700 V370 H745" class="flow"/>

  <rect x="255" y="480" width="690" height="48" rx="13" fill="#f8eadf" stroke="#78928b"/>
  <text x="285" y="510" class="body">真实 prompt 的 25-position 路径已验证；完整 64-row tile 继续验收</text>
</svg>
