<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SmolVLM Prompt 与 IDEFICS3 图片 chunk</title>
  <desc id="desc">真实 chat template 先形成媒体占位符，随后展开为 tile、overview 和文本 token，最终组成 Decoder embedding 序列。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset="1" stop-color="#deece7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#284b45"/>
    </marker>
    <style>
      .title { font: 700 28px 'Noto Sans CJK SC', sans-serif; fill: #173832; }
      .subtitle { font: 500 15px 'Noto Sans CJK SC', sans-serif; fill: #5d716c; }
      .heading { font: 700 18px 'Noto Sans CJK SC', sans-serif; fill: #173832; }
      .body { font: 500 14px 'Noto Sans CJK SC', sans-serif; fill: #284b45; }
      .small { font: 500 12px 'Noto Sans CJK SC', sans-serif; fill: #60756f; }
      .box { stroke: #284b45; stroke-width: 2; rx: 15; }
      .flow { stroke: #284b45; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <text x="55" y="55" class="title">SmolVLM：Template、Image Chunk 与 Decoder 序列</text>
  <text x="55" y="85" class="subtitle">Tokenizer 处理文本与特殊 token；Vision Encoder 提供同宽度 visual embedding</text>

  <rect x="55" y="135" width="290" height="330" class="box" fill="#fffaf0"/>
  <text x="82" y="175" class="heading">1 · Chat Template</text>
  <text x="82" y="215" class="body">&lt;|im_start|&gt;User:</text>
  <rect x="82" y="238" width="235" height="54" rx="9" fill="#f6d9c9" stroke="#a5522c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="105" y="271" class="body">&lt;__media__&gt;</text>
  <text x="82" y="330" class="body">问题文本</text>
  <text x="82" y="365" class="body">&lt;end_of_utterance&gt;</text>
  <text x="82" y="400" class="body">Assistant:</text>
  <text x="82" y="440" class="small">GGUF template + llama.cpp BPE</text>

  <rect x="455" y="120" width="300" height="375" class="box" fill="#e7eff9"/>
  <text x="482" y="160" class="heading">2 · IDEFICS3 Chunk</text>
  <rect x="482" y="190" width="246" height="48" rx="9" fill="#dcece7" stroke="#4f8277"/>
  <text x="502" y="220" class="body">row_1_col_1 · 64 rows</text>
  <rect x="482" y="252" width="246" height="48" rx="9" fill="#dcece7" stroke="#4f8277"/>
  <text x="502" y="282" class="body">... tiles 按行优先 ...</text>
  <rect x="482" y="314" width="246" height="48" rx="9" fill="#dcece7" stroke="#4f8277"/>
  <text x="502" y="344" class="body">row_R_col_C · 64 rows</text>
  <rect x="482" y="390" width="246" height="58" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="502" y="415" class="body">global-img overview</text>
  <text x="502" y="435" class="small">64 visual rows · 最后进入</text>
  <text x="482" y="475" class="small">每个 visual row 的 width 均为 960</text>

  <rect x="865" y="135" width="280" height="330" class="box" fill="#fffdf7"/>
  <text x="892" y="175" class="heading">3 · Decoder 输入</text>
  <rect x="892" y="205" width="226" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="912" y="235" class="body">prefix token embedding</text>
  <rect x="892" y="270" width="226" height="82" rx="9" fill="#dcece7" stroke="#4f8277" stroke-width="2"/>
  <text x="912" y="303" class="body">visual embedding</text>
  <text x="912" y="328" class="small">替换媒体占位位置</text>
  <rect x="892" y="370" width="226" height="48" rx="9" fill="#e9f3e6" stroke="#78928b"/>
  <text x="912" y="400" class="body">suffix token embedding</text>
  <text x="892" y="445" class="small">统一进入 32 层 Q8_0 Decoder</text>

  <path d="M345 290 H455" class="flow"/>
  <path d="M755 290 H865" class="flow"/>

  <rect x="150" y="535" width="900" height="52" rx="13" fill="#f8eadf" stroke="#78928b"/>
  <text x="180" y="558" class="body">已验证：overview-only 25；单 tile 88；动态图片 486 positions</text>
  <text x="180" y="578" class="small">动态图片：2×3 tiles + overview = 7 chunks，共 448 visual positions</text>
</svg>
