<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 09 在线延迟时间线</title>
  <desc id="desc">从 admission、进入 running、首 token 到请求终态，分别定义 queue wait、TTFT 和 completion latency。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/><stop offset="1" stop-color="#1f4e5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="28" font-weight="700">请求在线延迟时间线</text>
  <text x="60" y="88" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="16">统一从 admission 时刻起算，终态类型由 completed / failed / cancelled / timed out counters 区分</text>

  <line x1="120" y1="190" x2="1080" y2="190" stroke="#d9f0f2" stroke-width="5"/>
  <g font-family="Noto Sans CJK SC" text-anchor="middle">
    <g fill="#f6c85f">
      <circle cx="120" cy="190" r="13"/><circle cx="420" cy="190" r="13"/>
      <circle cx="730" cy="190" r="13"/><circle cx="1080" cy="190" r="13"/>
    </g>
    <g fill="#ffffff" font-size="18" font-weight="700">
      <text x="120" y="140">Admission</text><text x="420" y="140">进入 Running</text>
      <text x="730" y="140">首个 Token</text><text x="1080" y="140">请求终态</text>
    </g>
    <g fill="#b9d6e2" font-size="14">
      <text x="120" y="166">记录 admitted_at</text><text x="420" y="166">离开 waiting</text>
      <text x="730" y="166">第一次 callback</text><text x="1080" y="166">释放前只记录一次</text>
    </g>
  </g>

  <g font-family="Noto Sans CJK SC" font-size="16">
    <line x1="120" y1="255" x2="420" y2="255" stroke="#f6c85f" stroke-width="8" stroke-linecap="round"/>
    <text x="440" y="261" fill="#ffffff">queue wait = running - admission</text>
    <line x1="120" y1="310" x2="730" y2="310" stroke="#76c7c0" stroke-width="8" stroke-linecap="round"/>
    <text x="750" y="316" fill="#ffffff">TTFT = first token - admission</text>
    <line x1="120" y1="365" x2="1080" y2="365" stroke="#ef8a62" stroke-width="8" stroke-linecap="round"/>
    <text x="600" y="397" fill="#ffffff" text-anchor="middle">completion latency = terminal - admission</text>
  </g>
</svg>
