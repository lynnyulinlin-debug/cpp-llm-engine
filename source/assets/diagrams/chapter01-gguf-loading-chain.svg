<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Chapter 01 GGUF loading chain</title><desc id="desc">A four-layer loading chain from GGUF file to model builder.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1200" height="430" rx="20" fill="#f8fafc"/><text x="40" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Chapter 01 · GGUF 四层加载链</text><text x="40" y="70" font-family="sans-serif" font-size="14" fill="#475569">格式解析只负责把外部模型转换成稳定的内部输入，不把 GGUF 细节扩散到 Runtime</text><g font-family="sans-serif"><rect x="40" y="110" width="250" height="220" rx="16" fill="#e0edff"/><text x="165" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">1 · GGUF Reader</text><text x="165" y="178" text-anchor="middle" font-size="14" fill="#334155">文件头 / KV / Tensor Index</text><text x="165" y="210" text-anchor="middle" font-size="13" fill="#475569">输入：文件字节</text><text x="165" y="238" text-anchor="middle" font-size="13" fill="#475569">输出：key/value、offset</text><text x="165" y="282" text-anchor="middle" font-size="13" fill="#1e40af">不负责：模型语义</text><rect x="325" y="110" width="250" height="220" rx="16" fill="#dcfce7"/><text x="450" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">2 · Metadata Adapter</text><text x="450" y="178" text-anchor="middle" font-size="14" fill="#334155">架构 key → 统一字段</text><text x="450" y="210" text-anchor="middle" font-size="13" fill="#475569">输入：解析后的 KV</text><text x="450" y="238" text-anchor="middle" font-size="13" fill="#475569">输出：ModelMetadata</text><text x="450" y="282" text-anchor="middle" font-size="13" fill="#166534">不负责：读取 tensor 数据</text><rect x="610" y="110" width="250" height="220" rx="16" fill="#fef3c7"/><text x="735" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#a16207">3 · Tensor Loader</text><text x="735" y="178" text-anchor="middle" font-size="14" fill="#334155">名称 / Shape / DType / Offset</text><text x="735" y="210" text-anchor="middle" font-size="13" fill="#475569">输入：Tensor Index</text><text x="735" y="238" text-anchor="middle" font-size="13" fill="#475569">输出：Tensor map</text><text x="735" y="282" text-anchor="middle" font-size="13" fill="#854d0e">不负责：决定 Decoder 结构</text><rect x="895" y="110" width="265" height="220" rx="16" fill="#fce7f3"/><text x="1027" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#be185d">4 · Model Builder</text><text x="1027" y="178" text-anchor="middle" font-size="14" fill="#334155">Metadata + Tensor → Model</text><text x="1027" y="210" text-anchor="middle" font-size="13" fill="#475569">输入：统一内部对象</text><text x="1027" y="238" text-anchor="middle" font-size="13" fill="#475569">输出：Decoder / Runtime</text><text x="1027" y="282" text-anchor="middle" font-size="13" fill="#9d174d">不负责：解析文件格式</text></g><path d="M290 220H325M575 220H610M860 220H895" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="355" width="1120" height="42" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="600" y="382" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#334155">GGUF Reader 与 Metadata Adapter 可替换，Runtime 只依赖 ModelMetadata、Tensor 和 Tokenizer 契约</text></svg>
