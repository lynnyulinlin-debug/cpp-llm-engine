<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 09 Service Core</title>
  <desc id="desc">HTTP completion enters admission and waiting queues, then uses chunked prefill and token-block-budget steps to refill the running batch and release request resources.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/><stop offset="1" stop-color="#1f4e5f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#f6c85f"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="30" font-weight="700">Chapter 09 | Serving Extensions</text>
  <text x="60" y="94" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="17">把 Generation Runtime 接到可控的 C++ 服务核心</text>
  <g font-family="Noto Sans CJK SC" font-size="18" fill="#102a43" text-anchor="middle">
    <rect x="55" y="190" width="180" height="100" rx="16" fill="#f6c85f"/><text x="145" y="232">API / Gateway</text><text x="145" y="260" font-size="14">prompt tokens / SSE</text>
    <rect x="290" y="150" width="205" height="180" rx="16" fill="#ffffff"/><text x="392" y="192">Admission</text><text x="392" y="222" font-size="14">容量 / 重复 ID</text><text x="392" y="248" font-size="14">取消 / 超时</text><text x="392" y="274" font-size="14">backpressure</text>
    <rect x="555" y="125" width="180" height="95" rx="16" fill="#d9f0f2"/><text x="645" y="166">Waiting Queue</text><text x="645" y="194" font-size="14">FIFO / step 补位</text>
    <rect x="555" y="260" width="180" height="95" rx="16" fill="#d9f0f2"/><text x="645" y="296">Running Queue</text><text x="645" y="324" font-size="13">Request + Executor</text><text x="645" y="346" font-size="13">N x Context</text>
    <rect x="810" y="140" width="180" height="200" rx="16" fill="#ffffff"/><text x="900" y="178">Engine / Chapter 05</text><text x="900" y="206" font-size="14">1 x shared Model</text><text x="900" y="232" font-size="14">N x request Context</text><text x="900" y="258" font-size="14">Chunked Prefill</text><text x="900" y="284" font-size="14">Token / Block Step</text><text x="900" y="310" font-size="14">Block Pool / Cache</text>
    <rect x="1040" y="190" width="110" height="100" rx="16" fill="#f6c85f"/><text x="1095" y="232">Release</text><text x="1095" y="260" font-size="14">cache / context</text>
  </g>
  <g stroke="#f6c85f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M235 240 H285"/><path d="M495 205 H550"/><path d="M495 275 H550"/><path d="M735 172 H805"/><path d="M735 307 H805"/><path d="M990 240 H1035"/>
  </g>
  <text x="60" y="438" fill="#d9f0f2" font-family="Noto Sans CJK SC" font-size="16">当前产物：chunked prefill + 公平 step + BlockTable + HTTP/SSE + terminal 回收。</text>
  <text x="60" y="468" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="15">下一步：分层 device K/V payload 与并行 batch executor。</text>
</svg>
