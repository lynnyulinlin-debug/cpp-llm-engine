<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 05 block KV allocation and reuse</title>
  <desc id="desc">Request A maps two logical token blocks to non-contiguous physical blocks, then releases them for another request.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 26px; font-weight: 700; fill: #172033; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 17px; font-weight: 700; fill: #172033; }
      .text { font-family: "Noto Sans CJK SC"; font-size: 14px; fill: #334155; }
      .small { font-family: "Noto Sans CJK SC"; font-size: 13px; fill: #475569; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="22" fill="#f8fafc"/>
  <text x="42" y="48" class="title">Chapter 05 · Block KV 分配、寻址与复用</text>

  <rect x="42" y="82" width="310" height="270" rx="16" fill="#e8f1ff" stroke="#93c5fd"/>
  <text x="66" y="118" class="label">Request A · logical tokens</text>
  <text x="66" y="144" class="small">block_size = 3，token_count = 6</text>
  <g class="text" text-anchor="middle">
    <rect x="66" y="178" width="78" height="56" rx="9" fill="#bfdbfe"/><text x="105" y="201">token 0</text><text x="105" y="220">slot 0</text>
    <rect x="152" y="178" width="78" height="56" rx="9" fill="#bfdbfe"/><text x="191" y="201">token 1</text><text x="191" y="220">slot 1</text>
    <rect x="238" y="178" width="78" height="56" rx="9" fill="#bfdbfe"/><text x="277" y="201">token 2</text><text x="277" y="220">slot 2</text>
    <rect x="66" y="260" width="78" height="56" rx="9" fill="#93c5fd"/><text x="105" y="283">token 3</text><text x="105" y="302">slot 0</text>
    <rect x="152" y="260" width="78" height="56" rx="9" fill="#93c5fd"/><text x="191" y="283">token 4</text><text x="191" y="302">slot 1</text>
    <rect x="238" y="260" width="78" height="56" rx="9" fill="#93c5fd"/><text x="277" y="283">token 5</text><text x="277" y="302">slot 2</text>
  </g>

  <rect x="415" y="102" width="255" height="230" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="439" y="138" class="label">BlockTable A</text>
  <text x="439" y="164" class="small">逻辑 block 不要求物理连续</text>
  <g class="text">
    <rect x="439" y="190" width="207" height="48" rx="9" fill="#fed7aa"/>
    <text x="458" y="220">logical 0</text><text x="558" y="220">→ physical 2</text>
    <rect x="439" y="252" width="207" height="48" rx="9" fill="#fdba74"/>
    <text x="458" y="282">logical 1</text><text x="558" y="282">→ physical 0</text>
  </g>

  <rect x="735" y="82" width="423" height="270" rx="16" fill="#ecfdf5" stroke="#86efac"/>
  <text x="759" y="118" class="label">KvBlockPool · physical blocks</text>
  <text x="759" y="144" class="small">统一容量；request release 后 ID 回到 free pool</text>
  <g class="text" text-anchor="middle">
    <rect x="759" y="178" width="174" height="62" rx="10" fill="#86efac"/><text x="846" y="203">physical 0 · A</text><text x="846" y="224">tokens 3–5</text>
    <rect x="947" y="178" width="174" height="62" rx="10" fill="#fde68a"/><text x="1034" y="203">physical 1 · B</text><text x="1034" y="224">其他请求</text>
    <rect x="759" y="256" width="174" height="62" rx="10" fill="#bbf7d0"/><text x="846" y="281">physical 2 · A</text><text x="846" y="302">tokens 0–2</text>
    <rect x="947" y="256" width="174" height="62" rx="10" fill="#e2e8f0"/><text x="1034" y="281">physical 3</text><text x="1034" y="302">free</text>
  </g>

  <path d="M352 217H410" class="line"/>
  <path d="M670 217H730" class="line"/>

  <rect x="42" y="390" width="1116" height="86" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <g class="text" text-anchor="middle">
    <text x="172" y="424" class="label">reserve</text><text x="172" y="450">足量才一次性分配</text>
    <text x="450" y="424" class="label">commit / trim</text><text x="450" y="450">推进成功提交，失败回滚</text>
    <text x="728" y="424" class="label">locate</text><text x="728" y="450">token → physical block + slot</text>
    <text x="1006" y="424" class="label">release / reuse</text><text x="1006" y="450">A 释放 0、2，后续请求复用</text>
  </g>
  <path d="M282 432H330M560 432H608M838 432H886" class="line"/>
</svg>
