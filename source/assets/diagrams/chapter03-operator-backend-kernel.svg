<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 03 Operator Backend Kernel layers</title>
  <desc id="desc">Model operations use the implemented CPU reference backend; cuBLAS and custom kernels remain planned paths sharing the same future regression contract.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      .title { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #172033; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: 700; }
      .text { font-family: sans-serif; font-size: 14px; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .check { stroke: #0f766e; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="560" rx="20" fill="#f8fafc"/>
  <text x="40" y="42" class="title">Chapter 03 · Operator → Backend → Kernel</text>

  <rect x="40" y="70" width="1200" height="190" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="104" class="label" fill="#1d4ed8">模型语义与算子契约</text>
  <g text-anchor="middle" class="text">
    <rect x="80" y="145" width="180" height="64" rx="11" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="170" y="171">Linear / QKV / FFN</text><text x="170" y="193" fill="#475569">上层模型调用</text>
    <rect x="350" y="145" width="190" height="64" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="445" y="171">MatMul Contract</text><text x="445" y="193" fill="#1e40af">shape · layout · dtype</text>
    <rect x="630" y="133" width="210" height="88" rx="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="735" y="169" fill="#fff" font-weight="700">Operator</text><text x="735" y="193" fill="#dbeafe">what to compute</text>
    <rect x="930" y="145" width="220" height="64" rx="11" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="1040" y="171">Dispatch decision</text><text x="1040" y="193" fill="#475569">where / how to run</text>
  </g>
  <path d="M260 177H350M540 177H630M840 177H930" class="arrow"/>

  <rect x="40" y="300" width="760" height="210" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="64" y="334" class="label" fill="#c2410c">Backend 与 Kernel 执行路径</text>
  <g text-anchor="middle" class="text">
    <rect x="75" y="380" width="190" height="68" rx="11" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="170" y="408" font-weight="700" fill="#9a3412">CPU reference</text><text x="170" y="430" fill="#9a3412">可读、可调试</text>
    <rect x="305" y="380" width="190" height="68" rx="11" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="400" y="408" font-weight="700" fill="#9a3412">[规划] cuBLAS</text><text x="400" y="430" fill="#9a3412">vendor GEMM design</text>
    <rect x="535" y="380" width="220" height="68" rx="11" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
    <text x="645" y="408" font-weight="700" fill="#78350f">[规划] Custom kernel</text><text x="645" y="430" fill="#78350f">CUDA · Triton · other</text>
  </g>
  <path d="M1040 209V350H170V380M1040 209V350H400V380M1040 209V350H645V380" class="arrow"/>

  <rect x="840" y="300" width="400" height="210" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="864" y="334" class="label" fill="#047857">Kernel 落地与验证</text>
  <text x="864" y="378" class="text" fill="#065f46">Kernel / library call：实际执行</text>
  <text x="864" y="410" class="text" fill="#065f46">Shape contract：输入输出约束</text>
  <text x="864" y="442" class="text" fill="#065f46">Numerical regression：替换不改语义</text>
  <path d="M755 414H840" class="check"/>
  <path d="M495 448V475H1040V510" class="check"/>
  <text x="850" y="492" class="text" fill="#047857">CPU 已验证；规划路径必须复用同一验证底线</text>

  <rect x="930" y="70" width="310" height="62" rx="12" fill="#172033"/>
  <text x="955" y="97" class="label" fill="#fff">读源码时先问三件事</text>
  <text x="955" y="119" class="text" fill="#dbeafe">what · where/how · actual execution</text>
</svg>
