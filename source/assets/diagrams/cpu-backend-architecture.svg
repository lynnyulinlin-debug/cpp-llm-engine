<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CPU 主线与 GPU 扩展架构</title>
  <desc id="desc">展示已接入 Chapter02 Tensor view 与 Chapter03 MatMul 的 core contract，以及 CPU backend、decoder、runtime 和未来 CUDA backend 的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 25px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 16px; font-weight: 600; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC"; font-size: 14px; font-weight: 400; fill: #475569; }
      .box { stroke: #334155; stroke-width: 2; rx: 14; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="55" class="title">CPU 主线：先稳定契约，再替换 Backend</text>

  <rect x="60" y="105" width="200" height="82" class="box" fill="#fef3c7"/>
  <text x="160" y="140" text-anchor="middle" class="label">Core Contract</text>
  <text x="160" y="165" text-anchor="middle" class="small">Shape / Stride / Offset / Status</text>

  <rect x="315" y="105" width="200" height="82" class="box" fill="#fef3c7"/>
  <text x="415" y="140" text-anchor="middle" class="label">Operator</text>
  <text x="415" y="165" text-anchor="middle" class="small">Tensor / MatMul / Linear</text>

  <rect x="570" y="105" width="220" height="82" class="box" fill="#dbeafe"/>
  <text x="680" y="140" text-anchor="middle" class="label">CPU Backend</text>
  <text x="680" y="165" text-anchor="middle" class="small">Reference / Fused / SIMD</text>

  <rect x="845" y="105" width="220" height="82" class="box" fill="#dbeafe"/>
  <text x="955" y="140" text-anchor="middle" class="label">CPU Kernel</text>
  <text x="955" y="165" text-anchor="middle" class="small">Scalar / AVX2 / Threads</text>

  <path d="M260 146 H315" class="line"/><path d="M515 146 H570" class="line"/><path d="M790 146 H845" class="line"/>

  <rect x="190" y="290" width="250" height="88" class="box" fill="#dcfce7"/>
  <text x="315" y="328" text-anchor="middle" class="label">Decoder Layer</text>
  <text x="315" y="354" text-anchor="middle" class="small">Embedding / Attention / FFN / KV</text>
  <rect x="475" y="290" width="250" height="88" class="box" fill="#dcfce7"/>
  <text x="600" y="328" text-anchor="middle" class="label">Generation Runtime</text>
  <text x="600" y="354" text-anchor="middle" class="small">Prefill / Decode / Sampling</text>
  <rect x="760" y="290" width="250" height="88" class="box" fill="#dcfce7"/>
  <text x="885" y="328" text-anchor="middle" class="label">Request Service</text>
  <text x="885" y="354" text-anchor="middle" class="small">Scheduler / Streaming / Reclaim</text>
  <path d="M440 334 H475" class="line"/><path d="M725 334 H760" class="line"/>
  <path d="M680 187 V250 H315 V290" class="line"/>
  <text x="535" y="240" class="small">Chapter02/03 adapter 已接入</text>

  <rect x="250" y="465" width="250" height="82" class="box" fill="#fce7f3" stroke-dasharray="8 6"/>
  <text x="375" y="500" text-anchor="middle" class="label">CUDA Backend</text>
  <text x="375" y="526" text-anchor="middle" class="small">Device memory / stream / event</text>
  <rect x="650" y="465" width="250" height="82" class="box" fill="#fce7f3" stroke-dasharray="8 6"/>
  <text x="775" y="500" text-anchor="middle" class="label">CUDA Kernel</text>
  <text x="775" y="526" text-anchor="middle" class="small">cuBLAS / FlashAttention / custom</text>
  <path d="M680 187 V425 H375 V465" class="line"/>
  <path d="M500 506 H650" class="line"/>
  <text x="515" y="445" class="small">未来替换，不改上层 Runtime</text>
  <text x="600" y="590" text-anchor="middle" class="small">当前：Tensor view、MatMul 与 quantized Linear policy 已接入公共契约</text>
</svg>
