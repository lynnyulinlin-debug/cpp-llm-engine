<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 08 真实 TinyLlama CPU Profiling 证据</title>
  <desc id="desc">ServiceCore 基线先定位到模型计算，Decoder 和 FFN 子项计时定位量化 Linear，再用三组单变量和组合 A/B 验证 AVX2 优化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/><stop offset="1" stop-color="#1f4e5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="28" font-weight="700">真实 TinyLlama CPU Profiling：从服务阶段到 Decoder 热点</text>
  <text x="60" y="88" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="16">AMD Ryzen 9 9955HX · Release · Q4_K_M · 双请求服务基线 / 单请求 Decoder 子阶段</text>

  <text x="70" y="135" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="18" font-weight="700">1. ServiceCore 阶段归因</text>
  <rect x="70" y="155" width="1060" height="54" rx="12" fill="#d9f0f2"/>
  <rect x="70" y="155" width="557" height="54" rx="12" fill="#f6c85f"/>
  <rect x="627" y="155" width="503" height="54" rx="12" fill="#76c7c0"/>
  <g font-family="Noto Sans CJK SC" font-size="15" fill="#102a43" text-anchor="middle" font-weight="700">
    <text x="348" y="188">Prefill 52.526%</text>
    <text x="878" y="188">Decode 47.474%</text>
  </g>
  <text x="70" y="235" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="15">Model compute 99.9979% · Runtime / ServiceCore overhead 0.0021%</text>

  <text x="70" y="285" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="18" font-weight="700">2. Decoder 子阶段归因</text>
  <rect x="70" y="305" width="1060" height="58" rx="12" fill="#d9f0f2"/>
  <rect x="70" y="305" width="808" height="58" rx="12" fill="#ef8a62"/>
  <rect x="878" y="305" width="120" height="58" fill="#f6c85f"/>
  <rect x="998" y="305" width="96" height="58" fill="#76c7c0"/>
  <rect x="1094" y="305" width="36" height="58" rx="12" fill="#d9f0f2"/>
  <g font-family="Noto Sans CJK SC" font-size="12" fill="#102a43" text-anchor="middle" font-weight="700">
    <text x="474" y="339">FFN 76.249%</text>
    <text x="938" y="339">QKV 11.37%</text>
    <text x="1046" y="339">Out Proj 9.05%</text>
  </g>
  <text x="70" y="390" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="15">LM Head 3.263% · Attention 本体 0.022% · 短上下文热点集中在量化 Linear</text>

  <text x="70" y="435" fill="#ffffff" font-family="Noto Sans CJK SC" font-size="18" font-weight="700">3. FFN 内部归因</text>
  <rect x="70" y="455" width="1060" height="58" rx="12" fill="#d9f0f2"/>
  <rect x="70" y="455" width="345" height="58" rx="12" fill="#f6c85f"/>
  <rect x="415" y="455" width="345" height="58" fill="#76c7c0"/>
  <rect x="760" y="455" width="369" height="58" rx="12" fill="#ef8a62"/>
  <g font-family="Noto Sans CJK SC" font-size="13" fill="#102a43" text-anchor="middle" font-weight="700">
    <text x="242" y="489">Q4_K gate 32.58%</text>
    <text x="587" y="489">Q4_K up 32.58%</text>
    <text x="944" y="489">Q6_K down 34.79%</text>
  </g>
  <text x="70" y="540" fill="#b9d6e2" font-family="Noto Sans CJK SC" font-size="15">SwiGLU + residual + 未归因 0.050% · 三次实验分别只替换目标 Linear backend</text>

  <g font-family="Noto Sans CJK SC">
    <rect x="70" y="575" width="330" height="46" rx="14" fill="#ffffff"/>
    <text x="88" y="604" fill="#102a43" font-size="12" font-weight="700">Q6 down -41.58% · Decoder -13.15% · KEEP</text>
    <rect x="435" y="575" width="330" height="46" rx="14" fill="#ffffff"/>
    <text x="453" y="604" fill="#102a43" font-size="12" font-weight="700">Q4 gate/up -82.8% · Decoder -40.64% · KEEP</text>
    <rect x="800" y="575" width="330" height="46" rx="14" fill="#ffffff"/>
    <text x="818" y="604" fill="#102a43" font-size="12" font-weight="700">Q4 QKV/out -80.75% · Decoder -17.35% · KEEP</text>
  </g>
  <rect x="70" y="645" width="1060" height="48" rx="14" fill="#d9f0f2"/>
  <text x="600" y="675" fill="#102a43" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" text-anchor="middle">组合策略：Decoder -79.30% · ServiceCore dispatch -78.48% · 吞吐 +364.75% · KEEP</text>
</svg>
