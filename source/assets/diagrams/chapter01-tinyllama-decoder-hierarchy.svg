<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TinyLlama 22 层 Decoder 层级结构</title>
  <desc id="desc">TinyLlama 从 token embedding 进入 blk.0 到 blk.21 共 22 个重复 Decoder Block，再经过 output norm 和 LM head 产生 logits。下半部分展开单个 Decoder Block，并展示共享 Decoder 实现如何进入 Chapter01 数值对照和 Chapter05 Runtime golden test。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#page)"/>
  <text x="44" y="46" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#172033">TinyLlama · 22 层 Decoder 层级结构</text>
  <text x="44" y="76" font-family="Noto Sans CJK SC" font-size="14" fill="#475569">“22 层”只指 blk.0–blk.21；Embedding、最终 Norm 和 LM Head 位于 Decoder Block 之外</text>

  <g font-family="Noto Sans CJK SC">
    <rect x="44" y="112" width="176" height="92" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="132" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Token Embedding</text>
    <text x="132" y="173" text-anchor="middle" font-size="13" fill="#334155">token_embd.weight</text>
    <text x="132" y="191" text-anchor="middle" font-size="12" fill="#64748b">token ID → hidden[2048]</text>

    <rect x="268" y="98" width="528" height="120" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="532" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">22 × Decoder Block</text>
    <rect x="294" y="143" width="98" height="52" rx="10" fill="#ffffff" stroke="#4ade80"/>
    <rect x="412" y="143" width="98" height="52" rx="10" fill="#ffffff" stroke="#4ade80"/>
    <rect x="554" y="143" width="98" height="52" rx="10" fill="#ffffff" stroke="#4ade80"/>
    <rect x="672" y="143" width="98" height="52" rx="10" fill="#ffffff" stroke="#4ade80"/>
    <text x="343" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">blk.0</text>
    <text x="461" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">blk.1</text>
    <text x="532" y="175" text-anchor="middle" font-size="20" fill="#64748b">…</text>
    <text x="603" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">blk.20</text>
    <text x="721" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">blk.21</text>

    <rect x="844" y="112" width="142" height="92" rx="14" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="915" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#a16207">Output Norm</text>
    <text x="915" y="174" text-anchor="middle" font-size="12" fill="#334155">output_norm.weight</text>

    <rect x="1034" y="112" width="122" height="92" rx="14" fill="#fce7f3" stroke="#f9a8d4"/>
    <text x="1095" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#be185d">LM Head</text>
    <text x="1095" y="171" text-anchor="middle" font-size="12" fill="#334155">output.weight</text>
    <text x="1095" y="190" text-anchor="middle" font-size="12" fill="#64748b">→ logits[32000]</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M220 158H268"/>
    <path d="M796 158H844"/>
    <path d="M986 158H1034"/>
  </g>

  <path d="M532 218V260" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="550" y="246" font-family="Noto Sans CJK SC" font-size="13" font-weight="700" fill="#166534">展开一个 blk.N</text>

  <rect x="44" y="274" width="1112" height="432" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="309" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#334155">单个 Decoder Block：9 个权重 Tensor</text>
  <text x="1128" y="309" text-anchor="end" font-family="Noto Sans CJK SC" font-size="13" fill="#64748b">每层拥有独立 KV Cache</text>

  <g font-family="Noto Sans CJK SC">
    <rect x="72" y="342" width="132" height="66" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="138" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Hidden</text>
    <text x="138" y="392" text-anchor="middle" font-size="12" fill="#475569">[2048]</text>

    <rect x="242" y="342" width="154" height="66" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="319" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">RMSNorm</text>
    <text x="319" y="392" text-anchor="middle" font-size="11" fill="#475569">attn_norm.weight</text>

    <rect x="434" y="330" width="196" height="90" rx="12" fill="#dcfce7" stroke="#86efac"/>
    <text x="532" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Q / K / V Linear</text>
    <text x="532" y="377" text-anchor="middle" font-size="11" fill="#475569">attn_q.weight · Q[32×64]</text>
    <text x="532" y="397" text-anchor="middle" font-size="11" fill="#475569">attn_k.weight · attn_v.weight</text>
    <text x="532" y="413" text-anchor="middle" font-size="11" fill="#64748b">K/V[4×64]</text>

    <rect x="668" y="330" width="196" height="90" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="766" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">RoPE + Causal GQA</text>
    <text x="766" y="377" text-anchor="middle" font-size="11" fill="#475569">score → stable softmax</text>
    <text x="766" y="397" text-anchor="middle" font-size="11" fill="#475569">读取 / 追加本层 K、V</text>
    <text x="766" y="413" text-anchor="middle" font-size="11" fill="#64748b">32 Q heads / 4 KV heads</text>

    <rect x="902" y="342" width="182" height="66" rx="12" fill="#fce7f3" stroke="#f9a8d4"/>
    <text x="993" y="369" text-anchor="middle" font-size="15" font-weight="700" fill="#be185d">Output + Residual</text>
    <text x="993" y="392" text-anchor="middle" font-size="11" fill="#475569">attn_output.weight</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M204 375H242"/>
    <path d="M396 375H434"/>
    <path d="M630 375H668"/>
    <path d="M864 375H902"/>
    <path d="M993 408V452H319V476"/>
  </g>

  <g font-family="Noto Sans CJK SC">
    <rect x="242" y="476" width="154" height="66" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="319" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">RMSNorm</text>
    <text x="319" y="526" text-anchor="middle" font-size="11" fill="#475569">ffn_norm.weight</text>

    <rect x="434" y="464" width="196" height="90" rx="12" fill="#ffedd5" stroke="#fdba74"/>
    <text x="532" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Gate / Up Linear</text>
    <text x="532" y="511" text-anchor="middle" font-size="11" fill="#475569">ffn_gate.weight</text>
    <text x="532" y="531" text-anchor="middle" font-size="11" fill="#475569">ffn_up.weight</text>
    <text x="532" y="547" text-anchor="middle" font-size="11" fill="#64748b">SwiGLU · [5632]</text>

    <rect x="668" y="476" width="196" height="66" rx="12" fill="#ffedd5" stroke="#fdba74"/>
    <text x="766" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Down Linear</text>
    <text x="766" y="526" text-anchor="middle" font-size="11" fill="#475569">ffn_down.weight → [2048]</text>

    <rect x="902" y="476" width="182" height="66" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="993" y="504" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Residual Output</text>
    <text x="993" y="526" text-anchor="middle" font-size="11" fill="#475569">送入 blk.N+1</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M396 509H434"/>
    <path d="M630 509H668"/>
    <path d="M864 509H902"/>
  </g>

  <g font-family="Noto Sans CJK SC">
    <rect x="72" y="582" width="250" height="98" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="94" y="610" font-size="14" font-weight="700" fill="#047857">共享 Model · 独立 Context</text>
    <text x="94" y="636" font-size="12" fill="#065f46">Model：只读量化权重</text>
    <text x="94" y="658" font-size="12" fill="#475569">Context：position · K/V · stats</text>

    <rect x="372" y="582" width="320" height="98" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="394" y="610" font-size="14" font-weight="700" fill="#1d4ed8">Chapter01 · 数值闸门</text>
    <text x="394" y="636" font-size="12" fill="#334155">logits cosine 0.99952 · top-5 5/5</text>
    <text x="394" y="658" font-size="12" fill="#334155">双 Context 隔离 · sequence 4/4</text>

    <rect x="742" y="582" width="342" height="98" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="764" y="610" font-size="14" font-weight="700" fill="#c2410c">Chapter05 · Runtime 闸门</text>
    <text x="764" y="636" font-size="12" fill="#7c2d12">Tokenizer → Provider → Sampler</text>
    <text x="764" y="658" font-size="12" fill="#7c2d12">golden tokens match · CTest PASS</text>
  </g>

  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M322 631H372"/>
    <path d="M692 631H742"/>
  </g>
</svg>
