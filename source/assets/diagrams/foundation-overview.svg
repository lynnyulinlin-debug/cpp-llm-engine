<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Foundation overview and learning route</title>
<desc id="desc">Foundation sits before the inference engine mainline. Its CPU-first route moves from C++ and build basics through Tensor and runtime concepts. CUDA is an optional branch.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="700" rx="18" fill="#f8fafc"/>
<text x="36" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#172033">Foundation · 能力位置与学习路线</text>
<rect x="36" y="68" width="1128" height="250" rx="14" fill="#e8f1ff"/>
<text x="60" y="103" font-family="sans-serif" font-size="18" font-weight="700" fill="#24548f">在教程中的位置</text>
<g font-family="sans-serif" font-size="14" text-anchor="middle"><rect x="70" y="155" width="170" height="55" rx="9" fill="#fff"/><text x="155" y="188">C++ / 构建 / 调试</text><rect x="275" y="155" width="170" height="55" rx="9" fill="#bbf7d0"/><text x="360" y="188">Tensor / CPU</text><rect x="480" y="155" width="170" height="55" rx="9" fill="#bbf7d0"/><text x="565" y="188">Request / Batch</text><rect x="685" y="155" width="170" height="55" rx="9" fill="#22c55e"/><text x="770" y="188" fill="#fff">Chapter 00-05</text><rect x="890" y="155" width="200" height="55" rx="9" fill="#fde68a"/><text x="990" y="188">CUDA 选修</text></g>
<path d="M240 182H275M445 182H480M650 182H685" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="285" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#475569">CPU 是已实现主线；F03 / F07 / FQ10 提供 CUDA 基础，Chapter 03 GPU backend 尚在规划</text>
<rect x="36" y="350" width="1128" height="300" rx="14" fill="#ecfdf5"/><text x="60" y="385" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">学习路线</text>
<g font-family="sans-serif" font-size="14" text-anchor="middle"><rect x="70" y="445" width="180" height="78" rx="11" fill="#dbeafe"/><text x="160" y="476" font-weight="700" fill="#24548f">1. 工程基础</text><text x="160" y="501">F01 / F02 / F04</text><rect x="285" y="445" width="180" height="78" rx="11" fill="#dbeafe"/><text x="375" y="476" font-weight="700" fill="#24548f">2. 数据对象</text><text x="375" y="501">FQ02 / FQ03 / FQ08</text><rect x="500" y="445" width="180" height="78" rx="11" fill="#bbf7d0"/><text x="590" y="476" font-weight="700" fill="#166534">3. CPU 计算</text><text x="590" y="501">FQ06 / FQ12</text><rect x="715" y="445" width="180" height="78" rx="11" fill="#bbf7d0"/><text x="805" y="476" font-weight="700" fill="#166534">4. Runtime</text><text x="805" y="501">FQ07 / FQ09 / FQ11</text><rect x="930" y="445" width="195" height="78" rx="11" fill="#22c55e"/><text x="1027" y="476" font-weight="700" fill="#fff">5. Runtime 收口</text><text x="1027" y="501" fill="#fff">FQ13-FQ16</text></g>
<path d="M250 484H285M465 484H500M680 484H715M895 484H930" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="585" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#166534">完成入门与 CPU 主线后进入 Chapter 00 → Chapter 01；CUDA 按需加入</text>
</svg>
