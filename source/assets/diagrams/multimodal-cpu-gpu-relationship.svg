<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">多模态与现有 CPU GPU 主线关系</title>
  <desc id="desc">文本和图片在统一 embedding sequence 汇合，复用 LLM Decoder、Runtime 和 Serving，并可选择 CPU 或 GPU backend。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="1" stop-color="#e8f2ed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334b45"/>
    </marker>
    <style>
      .title { font: 700 28px 'Noto Sans CJK SC', sans-serif; fill: #18342e; }
      .subtitle { font: 500 15px 'Noto Sans CJK SC', sans-serif; fill: #587069; }
      .label { font: 700 18px 'Noto Sans CJK SC', sans-serif; fill: #18342e; }
      .body { font: 500 15px 'Noto Sans CJK SC', sans-serif; fill: #334b45; }
      .small { font: 500 13px 'Noto Sans CJK SC', sans-serif; fill: #587069; }
      .box { stroke: #334b45; stroke-width: 2; rx: 16; }
      .arrow { stroke: #334b45; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="60" y="60" class="title">多模态扩展的是输入与模型，不复制推理引擎</text>
  <text x="60" y="90" class="subtitle">文本 / 图片是能力轴，CPU / GPU 是执行轴；两条输入路径在 embedding sequence 汇合</text>

  <rect x="60" y="145" width="220" height="120" class="box" fill="#fff7df"/>
  <text x="85" y="180" class="label">文本输入</text>
  <text x="85" y="213" class="body">Tokenizer</text>
  <text x="85" y="238" class="small">token ids -> text embedding</text>

  <rect x="60" y="335" width="220" height="190" class="box" fill="#e8f0fa"/>
  <text x="85" y="370" class="label">图片输入</text>
  <text x="85" y="403" class="body">Decode / Resize / Normalize</text>
  <text x="85" y="432" class="body">Patch / Vision Encoder</text>
  <text x="85" y="461" class="body">Projector</text>
  <text x="85" y="493" class="small">RGB -> visual embedding</text>

  <rect x="385" y="235" width="250" height="190" class="box" fill="#f4ead8"/>
  <text x="414" y="273" class="label">统一 Embedding Sequence</text>
  <text x="414" y="309" class="body">text embeddings</text>
  <text x="414" y="338" class="body">+ visual embeddings</text>
  <line x1="414" y1="360" x2="606" y2="360" stroke="#aa7650" stroke-width="2"/>
  <text x="414" y="389" class="small">统一 position 与 mask 契约</text>

  <rect x="735" y="145" width="210" height="120" class="box" fill="#e7f3e8"/>
  <text x="760" y="180" class="label">LLM Decoder</text>
  <text x="760" y="213" class="body">Attention / FFN</text>
  <text x="760" y="238" class="small">复用 Chapter03-06</text>

  <rect x="735" y="305" width="210" height="120" class="box" fill="#e7f3e8"/>
  <text x="760" y="340" class="label">Runtime</text>
  <text x="760" y="373" class="body">Request / KV / Scheduler</text>
  <text x="760" y="398" class="small">复用 Chapter05</text>

  <rect x="735" y="465" width="210" height="120" class="box" fill="#e7f3e8"/>
  <text x="760" y="500" class="label">Serving</text>
  <text x="760" y="533" class="body">HTTP / SSE / Metrics</text>
  <text x="760" y="558" class="small">复用 Chapter07-09</text>

  <rect x="1020" y="190" width="130" height="120" class="box" fill="#fff"/>
  <text x="1048" y="226" class="label">CPU</text>
  <text x="1040" y="260" class="body">correctness</text>
  <text x="1044" y="286" class="small">reference</text>

  <rect x="1020" y="385" width="130" height="120" class="box" fill="#fff"/>
  <text x="1048" y="421" class="label">GPU</text>
  <text x="1040" y="455" class="body">acceleration</text>
  <text x="1044" y="481" class="small">backend</text>

  <path d="M280 205 H340 Q360 205 360 225 V285 Q360 305 385 305" class="arrow"/>
  <path d="M280 430 H340 Q360 430 360 410 V370 Q360 350 385 350" class="arrow"/>
  <path d="M635 330 H690 Q710 330 710 265 V205 Q710 205 735 205" class="arrow"/>
  <path d="M840 265 V305" class="arrow"/>
  <path d="M840 425 V465" class="arrow"/>
  <path d="M945 205 H980 Q995 205 995 250 H1020" class="arrow"/>
  <path d="M945 525 H980 Q995 525 995 445 H1020" class="arrow"/>

</svg>
