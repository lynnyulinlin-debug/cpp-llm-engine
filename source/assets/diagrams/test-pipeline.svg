<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tutorial test pipeline</title>
  <desc id="desc">Layered default CPU validation plus optional real-model, transport, performance, and CUDA device evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK SC">
    <text x="52" y="54" fill="#0f172a" font-size="28" font-weight="700">从局部行为到教程发布的验证流水线</text>

    <rect x="55" y="155" width="235" height="130" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
    <text x="172" y="198" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">单元测试</text>
    <text x="172" y="228" text-anchor="middle" fill="#475569" font-size="14">shape / state / numeric</text>
    <text x="172" y="254" text-anchor="middle" fill="#475569" font-size="14">每个 target 的 CTest</text>

    <rect x="345" y="155" width="235" height="130" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
    <text x="462" y="198" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">章节脚本</text>
    <text x="462" y="228" text-anchor="middle" fill="#475569" font-size="14">build / demo / ctest</text>
    <text x="462" y="254" text-anchor="middle" fill="#475569" font-size="14">固定临时 build</text>

    <rect x="635" y="155" width="235" height="130" rx="14" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
    <text x="752" y="198" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">全局回归</text>
    <text x="752" y="228" text-anchor="middle" fill="#475569" font-size="14">Foundation / core / engine</text>
    <text x="752" y="254" text-anchor="middle" fill="#475569" font-size="14">Chapter01-09 关键入口</text>

    <rect x="925" y="155" width="220" height="130" rx="14" fill="#fce7f3" stroke="#334155" stroke-width="2"/>
    <text x="1035" y="198" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">文档检查</text>
    <text x="1035" y="228" text-anchor="middle" fill="#475569" font-size="14">links / style / build</text>
    <text x="1035" y="254" text-anchor="middle" fill="#475569" font-size="14">SVG / 源码索引</text>

    <path d="M290 220 H340 M580 220 H630 M870 220 H920" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <rect x="345" y="330" width="525" height="82" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <text x="607" y="362" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">可选能力验证</text>
    <text x="607" y="390" text-anchor="middle" fill="#475569" font-size="14">real-model / transport / performance / CUDA device CTest（不进入默认回归）</text>
    <path d="M462 285 V310 H607 V325" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/>

    <text x="600" y="475" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">通过标准</text>
    <text x="600" y="508" text-anchor="middle" fill="#475569" font-size="14">正确性先通过；性能结果保存条件；文档入口可点击；空白和头注释检查无误</text>
  </g>
</svg>
