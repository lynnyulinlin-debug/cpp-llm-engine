<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 05 runtime request state and resource lifecycle</title>
  <desc id="desc">A request moves through admission, chunked prefill with a committed cursor, final logits, decode, streaming output, and terminal cleanup.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 24px; font-weight: 700; fill: #172033; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 16px; font-weight: 700; }
      .text { font-family: "Noto Sans CJK SC"; font-size: 14px; font-weight: 400; }
      .state { stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .resource { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .cleanup { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#red-arrow); }
    </style>
  </defs>
  <rect width="1280" height="560" rx="20" fill="#f8fafc"/>
  <text x="40" y="42" class="title">Chapter 05 · Runtime 状态与资源生命周期</text>

  <rect x="40" y="70" width="1200" height="230" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="64" y="104" class="label" fill="#1d4ed8">Request 状态流</text>
  <g class="text" text-anchor="middle">
    <rect x="70" y="160" width="130" height="58" rx="11" fill="#fff" stroke="#64748b" class="state"/><text x="135" y="185">submitted</text><text x="135" y="205">输入已校验</text>
    <rect x="250" y="160" width="130" height="58" rx="11" fill="#dbeafe" stroke="#2563eb" class="state"/><text x="315" y="185">waiting</text><text x="315" y="205">等待 admission</text>
    <rect x="430" y="160" width="130" height="58" rx="11" fill="#bfdbfe" stroke="#2563eb" class="state"/><text x="495" y="185">prefill chunk</text><text x="495" y="205">追加 KV + 游标</text>
    <rect x="610" y="160" width="130" height="58" rx="11" fill="#93c5fd" stroke="#1d4ed8" class="state"/><text x="675" y="185">running</text><text x="675" y="205">decode step</text>
    <rect x="790" y="160" width="130" height="58" rx="11" fill="#60a5fa" stroke="#1d4ed8" class="state"/><text x="855" y="185" fill="#fff">streaming</text><text x="855" y="205" fill="#fff">输出 token</text>
    <rect x="970" y="125" width="130" height="58" rx="11" fill="#bbf7d0" stroke="#16a34a" class="state"/><text x="1035" y="150">finished</text><text x="1035" y="170">EOS / token budget</text>
    <rect x="970" y="205" width="130" height="58" rx="11" fill="#fecaca" stroke="#dc2626" class="state"/><text x="1035" y="230">stopped</text><text x="1035" y="250">取消 / 超时 / 失败</text>
  </g>
  <path d="M200 189H250M380 189H430M560 189H610M740 189H790M920 165H970M920 215H970" class="arrow"/>
  <path d="M855 160V115H970" class="arrow"/>
  <path d="M855 218V280H675V220" class="arrow"/>
  <text x="765" y="272" text-anchor="middle" class="text" fill="#1d4ed8">下一 step 重新组 batch</text>

  <rect x="40" y="330" width="360" height="180" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="64" y="365" class="label" fill="#c2410c">Control Plane</text>
  <text x="64" y="400" class="text" fill="#7c2d12">Step Planner：decode 优先 + token budget</text>
  <text x="64" y="428" class="text" fill="#7c2d12">Prefill：已提交进度最少者优先</text>
  <text x="64" y="456" class="text" fill="#7c2d12">Backpressure：token / block 不足则等待</text>
  <text x="64" y="484" class="text" fill="#7c2d12">取消 / 超时：禁止重新入队</text>

  <rect x="460" y="330" width="360" height="180" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="484" y="365" class="label" fill="#047857">Execution Plane</text>
  <text x="484" y="394" class="text" fill="#065f46">Runtime：append chunk / final logits / EOS</text>
  <text x="484" y="420" class="text" fill="#065f46">Request Executor：toy / RealLlama CPU</text>
  <text x="484" y="446" class="text" fill="#065f46">Sampler：logits -> next token</text>
  <text x="484" y="472" class="text" fill="#065f46">Streaming：partial output -> client</text>

  <rect x="880" y="330" width="360" height="180" rx="16" fill="#fef2f2" stroke="#fecaca"/>
  <text x="904" y="365" class="label" fill="#b91c1c">Resource Plane</text>
  <text x="904" y="400" class="text" fill="#991b1b">Request Cache：token history</text>
  <text x="904" y="428" class="text" fill="#991b1b">Request Context：position + layer KV</text>
  <text x="904" y="456" class="text" fill="#991b1b">Block Pool：physical ID + slot</text>
  <text x="904" y="484" class="text" fill="#991b1b">Terminal：release request / context / blocks</text>

  <path d="M315 218V330" class="resource"/><path d="M495 218V330" class="resource"/><path d="M675 218V330" class="resource"/>
  <path d="M1035 263V300H1060V330" class="cleanup"/><text x="1070" y="316" class="text" fill="#b91c1c">统一回收</text>
</svg>
