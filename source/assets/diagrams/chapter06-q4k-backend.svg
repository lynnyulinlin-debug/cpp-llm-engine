<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 06 quantized Linear backend policy</title>
  <desc id="desc">Q4_K and Q6_K blocks use CPU reference, scalar or AVX2 backends, while the CUDA baseline dequantizes to a reusable Float32 workspace before cuBLAS SGEMM.</desc>
