    <text x="445" y="169" text-anchor="middle" fill="#334155">Q4_K / Q6_K dequantize</text>
    <text x="445" y="196" text-anchor="middle" fill="#334155">&#x2192; float buffer</text>
    <text x="445" y="223" text-anchor="middle" fill="#334155">&#x2192; Linear reference</text>
    <text x="445" y="252" text-anchor="middle" fill="#166534">&#x53EF;&#x89E3;&#x91CA; / &#x6613;&#x8C03;&#x8BD5;</text>
