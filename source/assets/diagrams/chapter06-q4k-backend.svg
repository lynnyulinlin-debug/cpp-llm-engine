  <text x="740" y="531" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="13" fill="#1e40af">CudaQuantizedMatrix &#x2192; CUDA dequantize &#x2192; Float32 Workspace &#x2192; cuBLAS SGEMM</text>
