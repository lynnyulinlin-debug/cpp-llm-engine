  </g>
  <rect x="600" y="295" width="560" height="55" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="880" y="318" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="700" fill="#5b21b6">QuantizedLinearPolicy + registry</text>
