    <text x="755" y="196" text-anchor="middle" fill="#334155">&#x2192; &#x7ACB;&#x5373;&#x7D2F;&#x52A0; dot</text>
    <text x="755" y="223" text-anchor="middle" fill="#334155">&#x2192; &#x4E0D;&#x751F;&#x6210;&#x5B8C;&#x6574; float</text>
    <text x="755" y="252" text-anchor="middle" fill="#854d0e">&#x9ED8;&#x8BA4;&#x53EF;&#x79FB;&#x690D;&#x8DEF;&#x5F84;</text>
    <rect x="940" y="100" width="220" height="175" rx="14" fill="#fce7f3"/>
