  <text x="40" y="70" font-family="Noto Sans CJK SC" font-size="14" fill="#475569">Chapter 01 &#x63D0;&#x4F9B; Q4_K/Q6_K block&#xFF0C;Chapter 06 &#x7EDF;&#x4E00;&#x9009;&#x62E9;&#x53EF;&#x6267;&#x884C; backend</text>
