<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CPU and GPU learning route</title>
  <desc id="desc">The complete CPU-first route and the optional CUDA route whose resource, quantized linear, RoPE, device KV, and causal GQA stages are implemented.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 17px; font-weight: 700; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC"; font-size: 14px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .branch { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="52" y="54" class="title">CPU-first 主线与 GPU 可选扩展</text>
  <rect x="52" y="105" width="1096" height="82" rx="14" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" class="label">共同起点：Foundation → Chapter00 → Chapter01</text>
  <text x="600" y="166" text-anchor="middle" class="small">C++17 / CMake / CTest / TinyLlama GGUF；CPU 即可开始</text>
  <path d="M600 187 V230" class="line"/>
  <rect x="70" y="245" width="510" height="220" rx="14" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
  <text x="325" y="282" text-anchor="middle" class="label">CPU 完整学习路线</text>
  <text x="325" y="320" text-anchor="middle" class="small">Chapter02 Tensor view</text>
  <text x="325" y="348" text-anchor="middle" class="small">Chapter03-04 Operator / Decoder</text>
  <text x="325" y="376" text-anchor="middle" class="small">Chapter05 Runtime / Chapter06 Q4_K</text>
  <text x="325" y="404" text-anchor="middle" class="small">Chapter07 Benchmark / Chapter08 Profiling</text>
  <text x="325" y="432" text-anchor="middle" class="small">Chapter09 CPU Service Core</text>
  <rect x="620" y="245" width="510" height="220" rx="14" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
  <text x="875" y="282" text-anchor="middle" class="label">GPU 可选扩展路线（P1-4B 已完成）</text>
  <text x="875" y="320" text-anchor="middle" class="small">DeviceBuffer / Stream / Event</text>
  <text x="875" y="348" text-anchor="middle" class="small">Vector Add / cuBLAS MatMul</text>
  <text x="875" y="376" text-anchor="middle" class="small">Q4_K / Q6_K dequantize + SGEMM</text>
  <text x="875" y="404" text-anchor="middle" class="small">RoPE / device KV / causal GQA 已完成</text>
  <text x="875" y="432" text-anchor="middle" class="small">合成单层已完成；下一步：TinyLlama 真实首层</text>
  <path d="M600 230 H325 V245" class="branch"/>
  <path d="M600 230 H875 V245" class="branch"/>
  <rect x="70" y="510" width="510" height="70" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="325" y="539" text-anchor="middle" class="label">CPU 环境</text>
  <text x="325" y="562" text-anchor="middle" class="small">Linux / C++17 / CMake / Node / 16 GB RAM</text>
  <rect x="620" y="510" width="510" height="70" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="875" y="539" text-anchor="middle" class="label">运行 GPU 资产时准备</text>
  <text x="875" y="562" text-anchor="middle" class="small">单卡 NVIDIA / CUDA / 8 GB 设计目标，最低显存待实测</text>
</svg>
