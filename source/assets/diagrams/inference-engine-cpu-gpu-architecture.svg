<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">推理引擎 CPU 主线与 GPU 扩展架构</title>
  <desc id="desc">输入、公共契约、算子、Decoder、Runtime 和服务层通过同一套上层接口连接 CPU 与 GPU 后端。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 27px sans-serif; fill: #0f172a; }
      .label { font: 700 16px sans-serif; fill: #0f172a; }
      .small { font: 14px sans-serif; fill: #475569; }
      .box { stroke: #334155; stroke-width: 2; rx: 14; }
      .input { fill: #fef3c7; }
      .shared { fill: #dcfce7; }
      .cpu { fill: #dbeafe; }
      .gpu { fill: #fce7f3; stroke-dasharray: 8 6; }
      .observe { fill: #e2e8f0; stroke-dasharray: 5 5; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <text x="54" y="52" class="title">推理引擎架构：公共契约连接 CPU 主线与 GPU 扩展</text>

  <rect x="54" y="92" width="230" height="78" class="box input"/>
  <text x="169" y="126" text-anchor="middle" class="label">输入与权重</text>
  <text x="169" y="151" text-anchor="middle" class="small">Tokenizer / GGUF / Tensor</text>
  <rect x="330" y="92" width="230" height="78" class="box shared"/>
  <text x="445" y="126" text-anchor="middle" class="label">Core Contract</text>
  <text x="445" y="151" text-anchor="middle" class="small">Shape / DType / Device / Ownership</text>
  <path d="M284 131 H330" class="line"/>

  <rect x="606" y="92" width="230" height="78" class="box shared"/>
  <text x="721" y="126" text-anchor="middle" class="label">Operator</text>
  <text x="721" y="151" text-anchor="middle" class="small">MatMul / Linear / Attention</text>
  <path d="M560 131 H606" class="line"/>
  <rect x="882" y="92" width="330" height="78" class="box shared"/>
  <text x="1047" y="126" text-anchor="middle" class="label">Decoder + Runtime</text>
  <text x="1047" y="151" text-anchor="middle" class="small">Embedding / KV Cache / Request / Scheduler</text>
  <path d="M836 131 H882" class="line"/>

  <rect x="260" y="238" width="760" height="92" class="box shared"/>
  <text x="640" y="275" text-anchor="middle" class="label">Service-facing control flow</text>
  <text x="640" y="301" text-anchor="middle" class="small">Prefill -> Decode -> Sampling -> Streaming -> Reclaim</text>
  <path d="M1047 170 V238" class="line"/>
  <path d="M445 170 V238" class="dash"/>

  <rect x="80" y="405" width="500" height="180" class="box cpu"/>
  <text x="330" y="443" text-anchor="middle" class="label">CPU Backend（当前主线）</text>
  <text x="330" y="474" text-anchor="middle" class="small">Reference -> Fused -> SIMD -> Threads</text>
  <text x="330" y="505" text-anchor="middle" class="small">Host Tensor / KV Cache / 回归测试</text>
  <text x="330" y="536" text-anchor="middle" class="small">目标：正确性、可调试、CPU First Success</text>
  <path d="M640 330 V370 H330 V405" class="line"/>

  <rect x="700" y="405" width="500" height="180" class="box gpu"/>
  <text x="950" y="443" text-anchor="middle" class="label">GPU Backend（稳定契约后的扩展）</text>
  <text x="950" y="474" text-anchor="middle" class="small">CUDA / cuBLAS / FlashAttention / Custom Kernel</text>
  <text x="950" y="505" text-anchor="middle" class="small">Device Tensor / Stream / Event / GPU KV Cache</text>
  <text x="950" y="536" text-anchor="middle" class="small">目标：带宽、吞吐、并行度和服务规模</text>
  <path d="M640 330 V370 H950 V405" class="line"/>

  <rect x="170" y="650" width="300" height="62" class="box observe"/>
  <text x="320" y="676" text-anchor="middle" class="label">Benchmark / Regression</text>
  <text x="320" y="699" text-anchor="middle" class="small">验证行为和性能变化</text>
  <rect x="790" y="650" width="300" height="62" class="box observe"/>
  <text x="940" y="676" text-anchor="middle" class="label">Profiling / A-B Evidence</text>
  <text x="940" y="699" text-anchor="middle" class="small">解释瓶颈并决定是否保留</text>
  <path d="M330 585 V620 H320 V650" class="dash"/>
  <path d="M950 585 V620 H940 V650" class="dash"/>
</svg>
